<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121c"/>
      <stop offset="0.55" stop-color="#092b3a"/>
      <stop offset="1" stop-color="#041926"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="62%">
      <stop offset="0" stop-color="#2fd6c3" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#f5c96b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f5c96b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.35" stop-color="#f5c96b"/>
      <stop offset="0.75" stop-color="#d99f34"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#f5c96b"/>
      <stop offset="1" stop-color="#c78a26"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sea)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- compass rose -->
  <g opacity="0.16" stroke="#f5c96b" fill="none">
    <circle cx="900" cy="315" r="270" stroke-width="1"/>
    <circle cx="900" cy="315" r="220" stroke-width="1" stroke-dasharray="4 12"/>
    <path d="M900 35 V595 M620 315 H1180 M704 119 L1096 511 M1096 119 L704 511" stroke-width="1"/>
  </g>

  <!-- waves -->
  <g fill="none" stroke="#2fd6c3" stroke-opacity="0.20" stroke-width="2">
    <path d="M0 520 Q120 492 240 520 T480 520 T720 520 T960 520 T1200 520"/>
    <path d="M0 560 Q120 532 240 560 T480 560 T720 560 T960 560 T1200 560"/>
    <path d="M0 600 Q120 572 240 600 T480 600 T720 600 T960 600 T1200 600"/>
  </g>

  <!-- coin -->
  <g filter="url(#coinShadow)" transform="translate(900 315)">
    <circle r="182" fill="url(#coin)"/>
    <circle r="158" fill="none" stroke="#8a5a12" stroke-width="3" opacity="0.75"/>
    <circle r="146" fill="none" stroke="#fff6d8" stroke-width="2" opacity="0.55"/>
    <!-- skull -->
    <g fill="#13202a" opacity="0.92">
      <path d="M-58 -34 a58 58 0 0 1 116 0 v34 a24 24 0 0 1 -12 21 v22 h-16 v-16 h-14 v16 h-16 v-16 h-14 v16 h-16 v-22 a24 24 0 0 1 -12 -21 z"/>
      <circle cx="-26" cy="-30" r="17" fill="#f5c96b"/>
      <circle cx="26" cy="-30" r="17" fill="#f5c96b"/>
      <path d="M0 -4 l-9 20 h18 z" fill="#f5c96b"/>
    </g>
    <!-- crossbones -->
    <g stroke="#13202a" stroke-width="14" stroke-linecap="round" opacity="0.85">
      <path d="M-92 92 L92 -92"/>
      <path d="M92 92 L-92 -92"/>
    </g>
    <g fill="#13202a" opacity="0.85">
      <circle cx="-98" cy="98" r="11"/><circle cx="-84" cy="84" r="11"/>
      <circle cx="98" cy="98" r="11"/><circle cx="84" cy="84" r="11"/>
      <circle cx="98" cy="-98" r="11"/><circle cx="84" cy="-84" r="11"/>
      <circle cx="-98" cy="-98" r="11"/><circle cx="-84" cy="-84" r="11"/>
    </g>
    <!-- hat -->
    <g transform="translate(0 -150) rotate(-12)">
      <ellipse cx="0" cy="0" rx="96" ry="22" fill="#6b4a19"/>
      <ellipse cx="0" cy="-4" rx="96" ry="20" fill="#d9b26a"/>
      <path d="M-46 -6 Q-42 -58 0 -60 Q42 -58 46 -6 Z" fill="#e6c47c"/>
      <path d="M-46 -14 Q0 -2 46 -14" fill="none" stroke="#8a5a12" stroke-width="9"/>
    </g>
  </g>

  <!-- title -->
  <g transform="translate(92 232)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9" fill="#8fb3c0">STRAW HAT ENTERTAINMENT PRESENTS</text>
    <text x="0" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="2" fill="url(#goldText)">GRAND LINE</text>
    <text x="0" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" letter-spacing="10" fill="url(#goldText)">CASINO</text>
    <text x="2" y="232" font-family="Arial, sans-serif" font-size="20" letter-spacing="3" fill="#c7dde5">SPIN · BET · PLUNDER · REPEAT</text>
  </g>

  <!-- badge -->
  <g transform="translate(92 505)">
    <rect width="360" height="48" rx="24" fill="rgba(245,201,107,0.10)" stroke="#f5c96b" stroke-opacity="0.45"/>
    <text x="180" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#f8e3ad">PLAY MONEY · NO REAL PRIZES</text>
  </g>

  <rect x="12" y="12" width="1176" height="606" rx="18" fill="none" stroke="#f5c96b" stroke-opacity="0.22" stroke-width="2"/>
</svg>
